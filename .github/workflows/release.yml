name: release

# Tags `v*` publish a GitHub Release; PRs build the same binaries as a dry run.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - name: build windows
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release -p mdp --target x86_64-pc-windows-msvc
          mkdir dist && cp target/x86_64-pc-windows-msvc/release/mdp.exe dist/mdp-windows-x86_64.exe
      - name: build macos (universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release -p mdp --target aarch64-apple-darwin
          cargo build --release -p mdp --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/mdp-macos-universal \
            target/aarch64-apple-darwin/release/mdp target/x86_64-apple-darwin/release/mdp
          lipo -info dist/mdp-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: mdp-${{ matrix.name }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
