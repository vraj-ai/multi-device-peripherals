[package]
name = "mdp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mdp"
path = "src/main.rs"

[dependencies]
mdp-core = { path = "../mdp-core" }
directories = "6"
hex = "0.4"
mdns-sd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
